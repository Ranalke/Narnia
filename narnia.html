<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Gdzie jest Łucja?</title>
<style>
  body {
    margin: 0;
    font-family: Georgia, serif;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #game {
    position: relative;
    width: 1024px;
    max-width: 100%;
    aspect-ratio: 1024 / 558;
    margin-top: 20px;
    overflow: hidden;
    border: 4px solid #3a2a1a;
  }

  #game img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  /* Hotspot: domyślnie NIEwidoczny */
  .hotspot {
    position: absolute;
    cursor: pointer;
    background: transparent;
    border: 3px solid transparent;
    border-radius: 8px;
    transition: background 0.15s, border-color 0.15s;
  }

  /* Podświetlenie tylko na hover */
  .hotspot:hover {
    background: rgba(255, 230, 150, 0.25);
    border-color: rgba(255, 230, 150, 0.9);
  }

  #dialogBox {
    width: 1024px;
    max-width: 100%;
    box-sizing: border-box;
    margin-top: 0;
    background: #2a1e14;
    border: 3px solid #6b4a2a;
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 16px 22px;
    min-height: 30px;
    font-size: 19px;
    color: #f0e0c0;
  }

  #dialogBox .narrator {
    font-weight: bold;
    color: #d8b878;
    margin-right: 6px;
  }
</style>
</head>
<body>

<div id="game">
  <img src="scena.png" alt="Pokój z szafą i łóżkiem">
  <!-- Hotspot: szafa (lewa strona obrazka) -->
  <div class="hotspot" id="hotspotSzafa" style="left: 4%; top: 2%; width: 40%; height: 90%;"></div>
  <!-- Hotspot: łóżko (prawa strona obrazka) -->
  <div class="hotspot" id="hotspotLozko" style="left: 75%; top: 50%; width: 24%; height: 48%;"></div>
</div>

<div id="dialogBox">
  <span class="narrator">Narrator:</span><span id="dialogText">Gdzie może być Łucja?</span>
</div>

<script>
  const dialogText = document.getElementById("dialogText");

  document.getElementById("hotspotLozko").addEventListener("click", () => {
    dialogText.textContent = "Tutaj na pewno jej nie ma.";
  });

  document.getElementById("hotspotSzafa").addEventListener("click", () => {
    dialogText.textContent = "Znaleziono Łucję! Weszła do szafy...";
    // tu można dodać np. przejście do kolejnej sceny
  });
</script>

</body>
</html>
